name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependances
        run: |
          # PySide6 a besoin de bibliotheques graphiques absentes de la machine de test
          # (sans elles : "libEGL.so.1: cannot open shared object file").
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install pyside6 psutil ruff pytest
      - name: Ruff (fautes de code)
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
